# Allowlist of sources. Anything not listed here never enters the pipeline.
#
# Verified 2026-10-06 against the live source (scripts/check_feeds.py +
# manual research for anything the script flagged). `verified: false` means
# the URL is reachable but not yet feed-shaped in a way M1's fetcher can use
# as-is (bot-blocked, wrong format, or needs a page scraper) — do not wire
# these into fetch/ until that's resolved; see each `note`.
#
# Fields: name, group (tech|geopolitics|science), tier (primary|journalism|think_tank),
# language, weight (1-3), access (rss|api|page), url, verified, note (optional)
#
# AP News was dropped entirely (not just marked unverified): its RSS
# infrastructure has been discontinued since Feb 2026, apnews.com now
# returns HTTP 403 to plain HTTP clients, and no official replacement feed
# exists. Reuters remains excluded for the same reason (no public RSS).

sources:
  - name: "Parlamentskorrespondenz"
    group: geopolitics
    tier: primary
    language: de
    weight: 3
    access: api
    url: "https://www.parlament.gv.at/Filter/api/filter/data/110?js=eval"
    verified: true
    note: >
      No RSS; this is the site's own filter-list JSON API (confirmed working
      via plain GET, returns paginated correspondence items with DATUM/PKTITEL
      fields). Replaces the originally-planned static RSS URL, which 404s.

  - name: "RIS Bundesgesetzblatt"
