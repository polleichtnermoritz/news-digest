    url: "https://www.ris.bka.gv.at/Ergebnis.wxe?Abfrage=BgblAuth"
    verified: true
    note: >
      Reachable (HTTP 200) but an HTML results page, not a feed, under every
      RSS export parameter tried. Needs a real scraper in M1, not a feed parser.

