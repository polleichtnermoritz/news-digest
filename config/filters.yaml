# Pre-filter rules applied in code (no LLM) before clustering.
# Drops routine items from primary law feeds (by title keyword) and anything
# with an empty teaser. Tuned in milestone M8 against recorded fixtures.
#
# The keyword check only applies to items whose source tier is "primary" and
# group is "geopolitics" (the law/official-journal feeds) — it never touches
# journalism or think-tank items.

drop_if_empty_teaser: true

law_feed_drop_keywords:
  de:
    - "Berichtigung"
    - "Kundmachung"
    - "Zolltarif"
    - "Gebührenordnung"
  en:
    - "correction"
    - "tariff schedule"
    - "administrative order"
