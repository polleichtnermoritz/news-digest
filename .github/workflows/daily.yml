name: Daily digest

on:
  schedule:
    # Vienna is UTC+1 (CET) or UTC+2 (CEST); 07:00 Vienna local falls on
    # 06:00 UTC in winter and 05:00 UTC in summer. Both crons fire every
    # day; `digest --run` checks the actual current Vienna hour itself and
    # exits early on whichever one doesn't match, so exactly one of the two
    # does real work regardless of DST. See src/digest/main.py:run_live.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out existing site (so the archive list sees history)
        uses: actions/checkout@v4
        continue-on-error: true  # gh-pages may not exist yet on a fresh repo
        with:
          ref: gh-pages
          path: site

      - name: Strip nested git metadata from the checked-out site
        run: rm -rf site/.git

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run digest pipeline
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run digest --run --force
          else
            uv run digest --run
          fi

      - name: Commit updated state
        if: steps.run.outputs.ran == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          [ -f state/podcast_episodes.json ] && git add state/podcast_episodes.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.run.outputs.ran == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          # Belt-and-braces: site/ is normally seeded with gh-pages' current
          # content above, so this matters mainly if that checkout step
          # fails (e.g. gh-pages doesn't exist yet) -- without keep_files,
          # this action's default wipes the whole publish branch before
          # copying site/ in, which would delete every earlier digest page
          # and podcast episode in that case. Orphaned files past state's
          # own retention window (seen.json / podcast_episodes.json) just
          # sit unlinked on gh-pages rather than being deleted -- a storage
          # cost, not a correctness problem, at this project's volume.
          keep_files: true
