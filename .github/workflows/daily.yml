name: Daily digest

on:
  schedule:
    # Vienna is UTC+1 (CET) or UTC+2 (CEST); 07:00 Vienna local falls on
    # 06:00 UTC in winter and 05:00 UTC in summer. Both crons fire every
    # day; `digest --run` checks the actual current Vienna hour itself and
    # exits early on whichever one doesn't match, so exactly one of the two
    # does real work regardless of DST. See src/digest/main.py:run_live.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run digest pipeline
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run digest --run --force
          else
            uv run digest --run
          fi

      - name: Commit updated state
        if: steps.run.outputs.ran == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.run.outputs.ran == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
